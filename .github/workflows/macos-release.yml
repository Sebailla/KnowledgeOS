name: macOS Release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: {node-version: '22'}
      - uses: pnpm/action-setup@v4
        with: {version: 10.15.0}
      - run: pnpm install --frozen-lockfile=false
      - run: scripts/build-macos-release.sh
      - run: scripts/package-macos-app.sh
      - run: scripts/validate-macos-bundle.sh
      - run: scripts/create-macos-archive.sh
      - uses: actions/upload-artifact@v7
        with:
          name: KnowledgeOS-macOS
          path: build/macos-release/KnowledgeOS-*.zip
