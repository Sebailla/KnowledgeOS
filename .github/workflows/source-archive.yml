name: Reproducible Source Archive
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/reproducibility/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
  push:
    tags: ['v1.0.0-rc.*']
permissions:
  contents: read
jobs:
  source-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rsync and zip
        run: sudo apt-get update && sudo apt-get install -y rsync zip unzip
      - name: Verify deterministic source archive
        run: scripts/reproducibility/verify-source-archive-reproducibility.sh
      - name: Build release source archive
        run: scripts/reproducibility/create-source-archive.sh artifacts/KnowledgeOS-1.0.0-rc.1-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: knowledgeos-source-archive
          path: |
            artifacts/KnowledgeOS-1.0.0-rc.1-source.zip
            artifacts/KnowledgeOS-1.0.0-rc.1-source.zip.sha256
