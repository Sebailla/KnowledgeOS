name: Distribution
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write
jobs:
  validate-deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deployment/production/compose.yaml config
      - run: bash -n scripts/deployment/*.sh scripts/distribution/*.sh
  containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [sync-server, master-library, local-library]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deployment/docker/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ghcr.io/${{ github.repository_owner }}/knowledgeos-${{ matrix.service }}:${{ github.ref_name }}
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: corepack enable && pnpm install --frozen-lockfile=false
      - run: scripts/build-macos-release.sh
      - run: scripts/package-macos-app.sh
      - run: scripts/validate-macos-bundle.sh
      - uses: actions/upload-artifact@v7
        with:
          name: KnowledgeOS-macOS-unsigned
          path: build/macos-release/KnowledgeOS.app
