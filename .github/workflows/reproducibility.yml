name: Reproducibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  frozen-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack prepare pnpm@10.15.0 --activate
      - run: bash scripts/reproducibility/validate-workspace-manifests.sh
      - run: test -f pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile=false
      # `pnpm validate` is `turbo run typecheck && turbo run test && turbo
      # run build`, but tsc needs the per-package `dist/index.d.ts` to
      # exist (paths in tsconfig.base.json resolve them). Build first.
      - run: pnpm build
      - run: pnpm validate
