name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path apple/Packages/KnowledgeOSCoreBridge
      - run: swift test --package-path apple/Packages/KnowledgeOSMobile
      - run: swift test --package-path apple/Apps/macOS
      - run: swift test --package-path apple/Apps/iOS
      - run: swift test --package-path apple/Apps/iPadOS
