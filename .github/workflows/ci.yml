name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack prepare pnpm@10.15.0 --activate
      - run: pnpm install --frozen-lockfile=false
      # Build MUST run before typecheck: every package declares
      # `types: "./dist/index.d.ts"` and tsconfig.base.json resolves
      # @knowledgeos/* via paths to packages/<name>/dist/index.d.ts.
      # Without a prior build, `dist/` is empty and tsc emits TS2307.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: swift test --package-path apple/Packages/KnowledgeOSCoreBridge
      - run: swift test --package-path apple/Packages/KnowledgeOSMobile
      - run: swift test --package-path apple/Apps/macOS
      - run: swift test --package-path apple/Apps/iOS
      - run: swift test --package-path apple/Apps/iPadOS
