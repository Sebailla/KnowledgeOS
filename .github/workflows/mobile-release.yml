name: Mobile Release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: scripts/test-mobile.sh
      - run: scripts/build-ios.sh
      - run: scripts/build-ipados.sh
      - run: scripts/validate-mobile-entitlements.sh
